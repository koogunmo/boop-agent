#:schema node_modules/wrangler/config-schema.json

name = "boop-agent"
main = "src/index.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]

worker_loaders = [
  { binding = "LOADER" },
]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[durable_objects]
bindings = [
  { name = "BOOP_AGENT", class_name = "BoopInteractionAgent" },
  { name = "EXEC_AGENT", class_name = "BoopExecutionAgent" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoopInteractionAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BoopExecutionAgent"]

[vars]
BOOP_MODEL = "workers-ai/@cf/moonshotai/kimi-k2.6"
MODEL_DISPATCHER = "workers-ai/@cf/moonshotai/kimi-k2.6"
MODEL_EXECUTOR = "workers-ai/@cf/moonshotai/kimi-k2.6"
MODEL_EXTRACTION = "workers-ai/@cf/moonshotai/kimi-k2.6"
MODEL_ADVERSARY = "workers-ai/@cf/moonshotai/kimi-k2.6"
MODEL_PROPOSER = "anthropic/claude-sonnet-4-6"
MODEL_JUDGE = "anthropic/claude-sonnet-4-6"
SENDBLUE_FROM_NUMBER = "+16452438873"
COMPOSIO_USER_ID = "boop-default"
